<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Luuri.net">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8dfc8"/>
      <stop offset="1" stop-color="#b9ac8a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1a10"/>
      <stop offset="1" stop-color="#05100a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#8cff9a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0d1a10" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="transparent"/>
      <rect width="4" height="1" y="2" fill="#000" fill-opacity="0.25"/>
    </pattern>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- Stand base -->
  <rect x="150" y="178" width="100" height="14" rx="2" fill="#9a8e6e"/>
  <rect x="178" y="160" width="44" height="22" fill="#c4b896"/>
  <rect x="178" y="160" width="44" height="4" fill="#9a8e6e"/>

  <!-- Monitor case -->
  <rect x="30" y="20" width="340" height="150" rx="10" fill="url(#case)" stroke="#6e6244" stroke-width="2"/>
  <!-- Case vents -->
  <g fill="#8a7e5e" opacity="0.6">
    <rect x="50" y="30" width="40" height="2"/>
    <rect x="50" y="36" width="40" height="2"/>
    <rect x="50" y="42" width="40" height="2"/>
  </g>
  <!-- Power LED -->
  <circle cx="350" cy="158" r="3" fill="#8cff9a"/>
  <circle cx="350" cy="158" r="6" fill="#8cff9a" opacity="0.25"/>
  <!-- Brand slot on case -->
  <rect x="240" y="150" width="70" height="8" rx="2" fill="#6e6244" opacity="0.4"/>

  <!-- Screen bezel -->
  <rect x="55" y="42" width="230" height="108" rx="8" fill="#2b2416"/>
  <!-- Screen -->
  <rect x="62" y="49" width="216" height="94" rx="6" fill="url(#screen)"/>
  <rect x="62" y="49" width="216" height="94" rx="6" fill="url(#glow)"/>

  <!-- CRT text: Luuri.net -->
  <g font-family="ui-monospace, 'Courier New', monospace" font-weight="700" fill="#8cff9a" filter="url(#soft)">
    <text x="170" y="88" text-anchor="middle" font-size="11" fill="#8cff9a" opacity="0.85">C:\&gt; RUN LUURI</text>
    <text x="170" y="118" text-anchor="middle" font-size="30" letter-spacing="2">Luuri.net</text>
    <rect x="238" y="124" width="8" height="3" fill="#8cff9a">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Scanlines overlay -->
  <rect x="62" y="49" width="216" height="94" rx="6" fill="url(#scan)"/>
  <!-- Screen highlight -->
  <path d="M66 53 Q120 60 140 55 L140 70 Q100 72 66 68 Z" fill="#ffffff" opacity="0.05"/>

  <!-- Side brand block -->
  <g transform="translate(390 60)">
    <rect x="0" y="0" width="70" height="100" rx="6" fill="#d9cda8" stroke="#6e6244" stroke-width="2"/>
    <text x="35" y="34" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#4a3f22" font-weight="700">LUURI</text>
    <text x="35" y="46" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#6e6244">.net</text>
    <rect x="10" y="58" width="50" height="3" fill="#8cff9a"/>
    <rect x="10" y="66" width="50" height="3" fill="#e45c81"/>
    <rect x="10" y="74" width="50" height="3" fill="#f1b434"/>
    <rect x="10" y="82" width="50" height="3" fill="#056b9f"/>
  </g>
</svg>
